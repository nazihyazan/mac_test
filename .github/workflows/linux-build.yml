name: Linux Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Linux test and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool squashfs-tools snapd rpm libgtk-3-0 libnss3 libgbm1 libasound2 libxss1

      - name: Test application startup and clipboard persistence
        run: |
          npm test
          xvfb-run -a npm run test:smoke
        
      - name: Build Linux App
        run: npm run build:linux
        
      - name: Inspect and smoke-test the built Snap
        run: xvfb-run -a npm run test:snap -- dist/linux/*.snap

      - name: Test startup under strict Snap confinement
        run: |
          sudo systemctl start snapd.socket
          sudo snap wait system seed.loaded
          sudo snap install --dangerous dist/linux/*.snap
          snap connections floatboard
          xvfb-run -a --server-args="-screen 0 1280x800x24 -ac -nolisten tcp" bash scripts/smoke-installed-snap.sh

      - name: Upload Linux App (Snap, AppImage, DEB, RPM)
        uses: actions/upload-artifact@v4
        with:
          name: floatboard-linux-app
          if-no-files-found: error
          path: |
            dist/linux/*.snap
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
