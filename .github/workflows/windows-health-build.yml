name: Windows Health Build

on:
  push:
    branches:
      - 'codex/windows-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Test Windows source app
        run: npm run test:win
      - name: Build Windows installer
        run: npm run build:win
      - name: Test packaged Windows app
        shell: pwsh
        run: |
          $env:FLOATBOARD_WINDOWS_EXECUTABLE = Join-Path $PWD 'dist/windows/win-unpacked/FloatBoard.exe'
          npm run test:win
      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: floatboard-1.0.18-windows-installer
          if-no-files-found: error
          path: dist/windows/FloatBoard-1.0.18-windows-x64.exe
